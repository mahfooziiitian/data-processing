[project]
name = "data-processing"
version = "0.1.0"
description = "A data-processing ETL proof-of-concept and demo: extract from CSV/API sources, transform with pandas, and load into PostgreSQL."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1.1",
    "psycopg2-binary>=2.9.13",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout: the installable package is src/data_proc, imported as `data_proc`.
packages = ["src/data_proc"]
