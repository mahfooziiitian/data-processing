site_name: Data Processing POC & Demo
site_description: A data-processing ETL proof-of-concept — extract, transform, and load with Python, pandas, and PostgreSQL.
repo_url: https://github.com/mahfooziiitian/data-processing
docs_dir: docs
nav:
  - Home: index.md
  - Tutorials:
      - Setup Guide: tutorials/setup.md
  - Explanation:
      - Architecture: explanation/architecture.md
      - Concepts: explanation/concepts.md

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - navigation.tabs

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
