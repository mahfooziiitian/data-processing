site_name: Data Processing POC & Demo
site_description: A data-processing ETL proof-of-concept — extract, transform, and load with Python, pandas, and PostgreSQL.
repo_url: https://github.com/mahfooziiitian/data-processing
docs_dir: docs
nav:
  - Home: index.md
  - Tutorials:
      - Setup Guide: tutorials/setup.md
  - How-To Guides:
      - Run the Kappa Demo: how-to/run-kappa-demo.md
      - Run the Lambda Demo: how-to/run-lambda-demo.md
  - Explanation:
      - Architecture: explanation/architecture.md
      - Concepts: explanation/concepts.md
      - Data Processing Patterns: explanation/data-processing-patterns.md
      - Data Processing Patterns Interview: explanation/data-processing-patterns-interview.md
      - Data Processing Patterns Company Interviews: explanation/data-processing-patterns-company-interviews.md

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - navigation.tabs
    - toc.integrate
    - navigation.footer

markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://d3js.org/d3.v7.min.js
  - assets/js/d3-diagrams.js
